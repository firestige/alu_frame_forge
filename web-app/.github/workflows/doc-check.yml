name: Documentation Checks

on:
  pull_request:
    paths:
      - 'doc/**'
      - 'README.md'
      - 'TODO.md'
      - '.github/workflows/doc-check.yml'
      - 'scripts/doc-check/**'
      - '.markdownlint-cli2.jsonc'
      - 'cspell.json'
  push:
    branches:
      - main
    paths:
      - 'doc/**'
      - 'README.md'
      - 'TODO.md'
      - 'scripts/doc-check/**'
      - '.markdownlint-cli2.jsonc'
      - 'cspell.json'
  workflow_dispatch: {}

jobs:
  quality:
    name: Markdown & Spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run documentation checks
        run: npm run doc:check

  links:
    name: Link Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            README.md
            doc/**/*.md
      - name: Upload lychee summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: ./lychee/out.md
